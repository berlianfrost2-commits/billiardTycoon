name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        run: |
          GODOT_VERSION="4.3-stable"
          GODOT_ZIP="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          wget -q "https://downloads.tuxfamily.org/godotengine/4.3/${GODOT_ZIP}" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Setup Export Templates
        run: |
          TEMPLATES_FILE="Godot_v4.3-stable_export_templates.tpz"
          wget -q "https://downloads.tuxfamily.org/godotengine/4.3/${TEMPLATES_FILE}" -O templates.tpz
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable/
          mv templates/android/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Create Export Config
        run: |
          cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          debug=false
          release=true
          export_path="build/BilliardTycoon.apk"
          options/package_name="com.berlian.billiardtycoon"
          options/version_code=1
          options/version_name="1.0"
          options/min_sdk=21
          options/use_keystore=false
          EOF

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/BilliardTycoon.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardTycoon_APK
          path: build/BilliardTycoon.apk
          retention-days: 30
          
